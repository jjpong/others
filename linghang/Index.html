<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彈性學習領航課程徵件｜資料整理</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1f2a2e; --muted:#6b7478; --line:#e2ddd2;
  --accent:#0f6b5c; --accent-2:#e7f2ef; --warn:#b5541c; --warn-bg:#fbeee5; --ok:#2f7d3b; --ok-bg:#e8f3e6;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --kai:"標楷體","DFKai-SB","BiauKai","BiauKaiTC","Kaiti TC","TW-Kai","AR PL UKai TW","KaiTi",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#f4f1ea;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
header .t1{font-size:13px;opacity:.75;letter-spacing:.04em}
header .t2{font-size:18px;font-weight:700;line-height:1.3}
header .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;background:rgba(255,255,255,.1);white-space:nowrap}
.pill.saving{background:#8a6d1d}.pill.err{background:#9b3412}.pill.ok{background:rgba(255,255,255,.12)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#f4f1ea}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.demo-bar{background:#f6d77a;color:#3d2f00;padding:6px 18px;font-size:13px}
/* layout */
#app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 60px)}
body.split #app{grid-template-columns:230px minmax(0,1fr) minmax(0,46vw)}
nav{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;background:#efebe2}
nav .ni{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:15px}
nav .ni:hover{background:#e5e0d4}
nav .ni.on{background:var(--panel);box-shadow:0 1px 0 var(--line);font-weight:700}
nav .ni .w{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
nav .sep{height:1px;background:var(--line);margin:8px 6px}
.dot{width:9px;height:9px;border-radius:50%;background:#cfc8b8;flex:none}
.dot.part{background:#e0a74a}.dot.done{background:var(--ok)}
main{padding:22px 28px 80px;max-width:980px;width:100%}
aside#pv{border-left:1px solid var(--line);position:sticky;top:60px;height:calc(100vh - 60px);display:none;flex-direction:column;background:#ddd8cc}
body.split aside#pv{display:flex}
.pvbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvbar .info{font-size:13px;color:var(--muted)}
.pvframe{flex:1;border:0;width:100%;background:#ddd8cc}
h2.pane{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px}
.card h3{margin:0;font-size:18px}
.card .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.card .meta{font-size:12px;color:var(--muted)}
.rubric{background:var(--accent-2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;margin:6px 0}
.rubric b{color:var(--accent)}
details.ex{margin:6px 0 10px;font-size:14px}
details.ex summary{cursor:pointer;color:#8a5a00;width:max-content;font-weight:600}
details.ex .exnote{font-size:12px;color:var(--muted);margin:6px 0}
details.ex .exc{background:#fffaf0;border:1px solid #efdfbf;border-radius:10px;padding:10px 12px;margin:8px 0;line-height:1.7}
details.ex .exh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
details.ex .exh a{font-size:12px;margin-left:auto}
details.ex .ext{margin-top:6px;color:var(--accent);font-size:13px}
details.dr summary{color:var(--accent)}
pre.draft{white-space:pre-wrap;font-family:var(--ui);font-size:14px;line-height:1.75;background:#f3f8f6;border:1px solid #cfe3dc;border-radius:10px;padding:10px 12px;margin:8px 0;max-height:420px;overflow:auto}
mark{background:#fff0a8;color:inherit;border-radius:3px;padding:0 2px}
table.tbl.plan td,table.tbl.plan th{font-size:14px;line-height:1.7}
table.tbl.plan th{color:var(--ink);background:#f3efe6;font-size:13px}
details.hint{font-size:14px;color:#4b5559;margin:6px 0 10px}
details.hint summary{cursor:pointer;color:var(--accent);width:max-content}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
.fld>span{font-size:13px;color:var(--muted)}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(15,107,92,.25);border-color:var(--accent)}
textarea{min-height:140px;resize:vertical;line-height:1.75}
input[readonly],textarea[readonly]{background:#faf8f3}
.chk{display:inline-flex;align-items:center;gap:6px;margin-right:14px;cursor:pointer}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px;align-items:center}
.tb .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.done-t{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;background:#fff;user-select:none}
.done-t.on{background:var(--ok-bg);border-color:#a9d0a5;color:var(--ok);font-weight:700}
.conf{background:var(--warn-bg);border:1px solid #e9bf9f;color:#7a3610;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
/* gallery */
.gal-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
.gi{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.gi .im{aspect-ratio:4/3;background:#eee center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.gi input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:13px}
.gi .ops{display:flex;justify-content:space-between;padding:2px 4px;background:#faf8f3}
.gi .ops button{border:0;background:transparent;cursor:pointer;padding:2px 6px;font-size:13px;color:var(--muted)}
.gi .ops button:hover{color:var(--ink)}
.drop{border:1.5px dashed #cbbfa9;border-radius:10px;padding:10px;text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.drop.over{background:var(--accent-2);border-color:var(--accent)}
.att{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:6px 0;font-size:14px}
.att .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* dashboard */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.big{font-size:34px;font-weight:800;line-height:1.1}
.bar{height:10px;background:#e9e4d8;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--warn)}
.cl{list-style:none;padding:0;margin:0}
.cl li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cl li:last-child{border-bottom:0}
.st{flex:none;font-size:12px;border-radius:999px;padding:1px 9px;font-weight:700;margin-top:2px}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.no{background:var(--warn-bg);color:var(--warn)}.st.mid{background:#fbf1d9;color:#8a6200}.st.na{background:#eee;color:#777}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl td,table.tbl th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tbl th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
table.tbl td.nw{white-space:nowrap}
.muted{color:var(--muted)}
.warnbox{background:var(--warn-bg);border:1px solid #e9bf9f;border-radius:10px;padding:10px 14px;color:#7a3610;font-size:14px;margin:0 0 14px}
.okbox{background:var(--ok-bg);border:1px solid #b5d8b0;border-radius:10px;padding:10px 14px;color:#245f2d;font-size:14px;margin:0 0 14px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,28,30,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:14px;max-width:560px;width:100%;padding:22px 24px;max-height:90vh;overflow:auto}
#modal h3{margin:0 0 10px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#modal pre{white-space:pre-wrap;background:#f3efe6;border-radius:8px;padding:8px 10px;max-height:180px;overflow:auto;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media (max-width:900px){
  #app,body.split #app{grid-template-columns:1fr}
  nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav .ni{width:auto;white-space:nowrap}
  nav .ni .w,nav .sep{display:none}
  main{padding:16px}
  body.split aside#pv{display:none}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="t1">臺北市115年度國民中學彈性學習領航課程徵件比賽</div>
    <div class="t2" id="hdCourse">審查資料整理</div>
  </div>
  <div class="grow"></div>
  <span class="pill" id="hdCount"></span>
  <span class="pill ok" id="hdSave">載入中…</span>
  <button class="btn ghost sm" id="btnSplit" title="在右側並排顯示預覽">並排預覽</button>
  <button class="btn ghost sm" id="btnMode">進入編輯</button>
</header>
<div id="demoBar" class="demo-bar" style="display:none">示範模式：尚未連接資料庫，資料只存在這台電腦的瀏覽器裡（圖片重新整理後會消失），編輯密碼 demo。　<button class="btn sm" id="btnSetApi">連接資料庫</button></div>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"><div class="loading">資料載入中…</div></main>
  <aside id="pv">
    <div class="pvbar">
      <button class="btn sm pri" data-act="refreshPreview">重新整理預覽</button>
      <button class="btn sm" data-act="printPdf">列印／另存 PDF</button>
      <button class="btn sm" data-act="exportDocx">下載 Word</button>
      <span class="info" id="pvInfo"></span>
    </div>
    <iframe class="pvframe" id="pvFrame" title="文件預覽"></iframe>
  </aside>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<script id="boot" type="application/json"><?!= boot ?></script>

<script>
/* =========================================================
 *  瀏覽器暫存（被瀏覽器封鎖時改用記憶體，不會讓網頁卡住）
 * ========================================================= */
const LS = (() => {
  let ok = false; const mem = {};
  try { window.localStorage.setItem('__lh', '1'); window.localStorage.removeItem('__lh'); ok = true; } catch (e) {}
  return {
    getItem: k => { try { if (ok) return window.localStorage.getItem(k); } catch (e) {} return k in mem ? mem[k] : null; },
    setItem: (k, v) => { mem[k] = String(v); try { if (ok) window.localStorage.setItem(k, v); } catch (e) {} },
    removeItem: k => { delete mem[k]; try { if (ok) window.localStorage.removeItem(k); } catch (e) {} }
  };
})();
/* =========================================================
 *  資料庫網址（Apps Script 網頁應用程式的 /exec 網址）
 *  放在 GitHub Pages 時使用；也可用 ?api=網址 帶入
 * ========================================================= */
const DEFAULT_API = '';
const API_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/;
const API_URL = (() => {
  try {
    const q = new URLSearchParams(location.search).get('api');
    if (q && API_RE.test(q)) { LS.setItem('lh_api', q); return q; }
  } catch (e) {}
  const saved = LS.getItem('lh_api');
  return (saved && API_RE.test(saved)) ? saved : DEFAULT_API;
})();
/* =========================================================
 *  設定：外部函式庫（從 CDN 載入）
 * ========================================================= */
const LIB = {
  paged: 'https://cdn.jsdelivr.net/npm/pagedjs@0.4.3/dist/paged.polyfill.min.js',
  docx:  'https://cdn.jsdelivr.net/npm/docx@9.16.0/dist/index.iife.js'
};
const DEADLINE = new Date('2026-12-31T17:00:00+08:00');
const OPEN_AT  = new Date('2026-12-14T00:00:00+08:00');
const PAGE_LIMIT = 20;
const CN = '零一二三四五六七八九十'.split('');
const cn = n => n <= 10 ? CN[n] : (n < 20 ? '十' + CN[n - 10] : String(n));

/* =========================================================
 *  內容結構（依實施計畫「績優規準」）
 * ========================================================= */
const SECS = [
  { id:'design', num:'壹', title:'課程設計', weight:'不計分（必要條件）', budget:'約 1～2 頁',
    items:[
      { id:'design_text', title:'課程設計要項',
        hint:'簡要說明課程理念（與學校願景的連結）、課程目標、核心素養、跨領域統整的方式與課程架構。本項不列入計分，但「課程計畫連結或 PDF」是評審的必要條件。建議 1 頁內，可放一張課程架構圖。' }
    ]},
  { id:'impl', num:'貳', title:'課程實施', weight:'50%', budget:'約 8 頁',
    items:[
      { id:'impl_overview', title:'教學實施歷程',
        hint:'敘明本課程為一學期或一學年的教學實施歷程：期程、總節數、單元安排。得獎課程常見做法：先用「課程脈絡表（分階段）」交代各階段的探究層級與主要任務（例如從食譜式、結構式到引導式探究），再用「學習進度與檢核點表」列出每段的形成性評量檢核點。原課程若橫跨二學年以上，以提報參選的課程計畫為主，其他學期以文字說明相關性。若課程計畫有修訂，可在這裡擇要說明。' },
      { id:'impl_c1', title:'結合能力經驗', rubric:'考量學生的先備經驗與生活情境，結合教材內容來引發學習動機。',
        hint:'寫出學生已有的先備經驗（學過的概念、生活經驗），以及你用什麼情境或任務引發動機。可放引起動機活動的照片或情境任務單。' },
      { id:'impl_c2', title:'點線面的串連', rubric:'掌握課程主軸，串連各個教學活動與素材，以有效學習。',
        hint:'說明課程主軸（核心問題或大概念），再說明各單元／活動如何層層串連到主軸。課程架構圖、單元關聯圖很適合放在這裡。' },
      { id:'impl_c3', title:'導入探究實作', rubric:'導入相關探究模式，或提供學生體驗、觀察、記錄、整理、規劃或製作等方法策略，使學生不只學會內容也學會如何學習。',
        hint:'說明採用的探究模式（例如 5E、PBL、設計思考）與學生實際的觀察、記錄、整理、規劃、製作過程，並點出學生「學會了哪些學習方法」。放實作照片、學習單。' },
      { id:'impl_c4', title:'搭配學習資源', rubric:'自編／自選教材或相關教學資源，能呼應課程目標，落實課程設計。',
        hint:'列出自編／自選教材、簡報、學習單、教學影片、外部資源等代表性投入，並說明各自呼應哪一個課程目標。可用表格整理：資源名稱／類型／對應目標。' },
      { id:'impl_c5', title:'共備討論精進', rubric:'參與教師社群的共備討論或觀議課，適時改進課程計畫及其實施。',
        hint:'呈現學習社群討論歷程：時間、形式（共備／觀課／議課）、討論重點，以及據此做的修正。建議用「共備紀錄表」範本，再搭配會議紀錄或觀課照片。' },
      { id:'impl_c6', title:'適時合宜調整', rubric:'依課程計畫進行教學，並視課程內容、學生特質及資源條件，合宜調整教材教法，有助培養核心素養並達成課程目標。',
        hint:'說明實施中依學生特質、進度或資源條件所做的教材教法調整：原本怎麼做、遇到什麼狀況、怎麼調整、調整後的效果。建議用「教學調整表」逐項標出保留／調整為／刪除，並寫出調整依據（例如學生回饋顯示實驗操作是主要困難，所以改用生活中熟悉的素材）。' }
    ]},
  { id:'effect', num:'參', title:'課程效果', weight:'30%', budget:'約 6 頁',
    items:[
      { id:'eff_form', title:'形成性評量', rubric:'能呼應課程目標進行形成性評量，並根據評量結果進行學習輔導或教學調整。',
        hint:'說明形成性評量的方式（前測、檢核點、Gallery Walk、學習單、即時回饋…）、對應哪個課程目標，以及依結果做了哪些學習輔導或教學調整。得獎課程會放前測題目與學生起點表現，並說明據此怎麼調整。可用「前後測比較表」「學生回饋統計表」呈現數據。' },
      { id:'eff_sum', title:'總結性評量－表現任務', rubric:'能扣緊課程目標進行「總結性評量－表現任務」，並有清楚的任務說明或評量尺規，引導學生整合運用所學、多元展能並願意為自己的學習負起責任。',
        hint:'寫出表現任務內容與任務說明，並附上評量尺規（建議用「評量尺規表」範本：向度 × 等級描述）。說明任務如何讓學生整合所學、自我負責。' },

const DRAFTS = {"design_text": "### 課程理念\n「水資源」是臺灣與世界各國都必須面對的重大議題。本課程從學生每天的用水經驗出發，帶領學生認識水資源的重要性與稀缺性，探究不同的取水與淨水方式，並結合本校國際交流機會，與他國學生交流水資源議題，培養學生成為地球公民的素養。【可補一句：與本校願景或學生圖像的連結】\n### 課程目標\n1. 認識地球水資源的稀缺性與重要性，從自我用水到世界各國的用水現況，理解水資源問題的全貌。\n2. 認識臺灣及世界各國的淨水科技，探究自製淨水器的原理與提升效能的策略。\n3. 提出適當策略改善自我用水效能、降低生活造成的水污染，實踐節水與減污的行動。\n### 核心素養與議題融入\n本課程對應核心素養 J-A2、J-A3、J-B2、J-C1、J-C2，並融入環境教育（環J4）、國際教育（國J12）與戶外教育（戶J2、戶J4）。\n### 跨領域統整\n本課程整合【請確認領域：自然科學（過濾與淨水原理、測量與紀錄）、社會（臺灣與世界的水資源分布）、英語（閱讀 Gapminder 英文資料）、科技（Scratch 用水估算、iMovie 影片製作）】，由本校跨領域共備社群共同發展。\n### 課程架構\n| 階段 | 節次 | 學習重點 |\n|---|---|---|\n| 看見世界的水 | 第1節 | 世界淡水分布、聯合國永續發展目標 6 |\n| 我用了多少水 | 第2節 | 洗手用水量預測與實測、一日用水量估算 |\n| 比較各國用水 | 第3節 | Dollar Street 跨國比較、提水體驗 |\n| 淨水探究 | 第4–5節 | 過濾器的設計、測試與改良 |\n| 連結在地 | 第6節 | 萬華區與本校用水、自來水廠參訪 |\n| 採取行動 | 第7–10節 | 節水妙招／從水看世界影片 |\n", "impl_overview": "本課程為八年級上學期的一學期課程，每週 0.5 節（與「臺灣之光」單雙週對開），全學期共 10 節，於 114 學年度上學期實施，共【__】個班級、【__】位學生參與。\n### 課程脈絡\n| 階段 | 節次（週次） | 重點 | 主要任務 |\n|---|---|---|---|\n| 一、看見水的問題 | 第1–3節（1–6週） | 認識世界與自我用水現況 | 洗手用水實測、一日用水估算、Dollar Street 跨國比較 |\n| 二、淨水探究 | 第4–5節（7–10週） | 設計並改良過濾器 | 分析濾材、設計粗吸管過濾器、測透光度與速度、改良再測 |\n| 三、連結在地 | 第6節（11–12週） | 認識臺灣與萬華的水 | 了解自來水淨水流程、參訪自來水廠 |\n| 四、採取行動 | 第7–10節（13–20週） | 總結性表現任務 | 分組製作並發表節水妙招或從水看世界影片 |\n### 學習進度與檢核點\n| 節次 | 單元 | 形成性評量（檢核點） |\n|---|---|---|\n| 1 | 世界上的水 | 回家找出水表、查看水費單 |\n| 2 | 水有多重要？ | 洗手用水量的預測與實測紀錄 |\n| 3 | 世界各國使用水資源的現況 | 學習單「水與生活國際篇」 |\n| 4 | 過濾水的探究（一） | 學習單「過濾觀察記錄與過濾器設計」 |\n| 5 | 過濾水的探究（二） | 口頭報告：設計、成效、改良與差異 |\n| 6 | 乾淨水從哪裡來 | 對淨水流程提出想進一步了解的問題 |\n| 7–10 | 我的省水妙招／從水看世界 | 方案提案、影片製作、成果發表 |\n【若實際教學的順序或內容與計畫不同，在「適時合宜調整」說明】\n", "impl_c1": "學生每天都在用水，卻很少意識到自己用了多少水。課程第一節，學生用便條紙寫下一天中需要用水的時刻，選出最重要的 5 個，再想一想：如果必須捨棄，會留下哪些？藉此排出自己對水的需求順序。回家後，學生找出家中的水表、查看水費單，估算家裡一個月的用水量大約是自己一次洗手的多少倍。\n第二節先讓學生看一公升的水有多少，再預測「手沾到油污時，洗乾淨要用多少水」，接著實際沾油、用清潔劑洗手，以量筒承接測量。【請填：學生預測值與實測值的分布，例如多數學生預測約 __ mL，實測平均約 __ mL】預測與實測的落差，讓學生對用水量有了具體的量感，也自然引出下一個問題：世界上其他人用了多少水？\n", "impl_c2": "本課程以「水資源的稀缺性」為主軸，從學生自己的一次洗手，逐步擴展到世界與在地，最後回到行動：\n- 點：個人用水——洗手實測、Scratch 估算一日用水量\n- 線：從自己到世界——Dollar Street 觀察不同國家、不同收入家庭的取水方式，提著 6 公升的水走 100 公尺體驗取水\n- 面：從理解到行動——淨水探究、認識在地水源，最後以影片提出節水方案或介紹他國水資源現況\n活動之間環環相扣：第二節估算的一日用水量，在第三節變成「要提幾趟水」的計算依據；第四、五節的過濾器探究，成為第六節理解自來水廠淨水流程的基礎；前六節累積的資料與體驗，則是第七節後表現任務的素材。【可補：貫穿全課程的核心問題，例如「乾淨的水從哪裡來？我們用了多少？我們能做什麼？」】\n", "impl_c3": "過濾水探究是本課程的核心探究活動，共兩節，學生經歷「觀察分析 → 設計 → 測試 → 改良」的完整歷程。\n### 觀察與分析\n以 Dollar Street 中部分國家的水樣提問「這樣的水你敢喝嗎？」，再分析生命吸管與露營用過濾器：用了哪些濾材？各有什麼功能？排列順序有什麼共同點？\n### 設計\n學生用粗細砂石、活性碳、棉花等濾材過濾教師調製的污水（細碎枝葉、培養土與色素混合），觀察並記錄各濾材的效果，再分組討論濾材的選擇與填充順序，設計粗吸管過濾器。評估標準為過濾後的透光度與過濾速度。\n### 測試與改良\n各組組裝過濾器、實際過濾污水，依結果提出改善方式後再過濾一次，比較前後差異，並以口頭報告說明原設計、成效、改進方式與改良後的差異。\n| 組別 | 原設計（濾材順序） | 透光度 | 過濾速度 | 改良方式 | 改良後 |\n|---|---|---|---|---|---|\n| 【第__組】 |  |  |  |  |  |\n| 【第__組】 |  |  |  |  |  |\n在這個歷程中，學生學到的不只是過濾原理，更是「先訂評估標準、用數據比較、再依結果修正設計」的探究方法。\n", "impl_c4": "本課程的教學資源以真實資料與自編教材為主，每項資源都對應課程目標：\n| 資源 | 類型 | 對應課程目標 |\n|---|---|---|\n| Gapminder 網站（聯合國目標 6 英文閱讀題） | 網路資源 | 目標一：理解世界水資源現況 |\n| Dollar Street（get water、hand washing 等主題） | 網路資源 | 目標一 |\n| 自製 Scratch 一日用水量估算程式 | 自編教材 | 目標一、三 |\n| 學習單「水與生活國際篇」 | 自編學習單 | 目標一 |\n| 學習單「過濾觀察記錄與過濾器設計」 | 自編學習單 | 目標二 |\n| 剛果取水影片 | 影片 | 目標一 |\n| 濾材（砂石、活性碳、棉花）、量筒、粗吸管 | 實作器材 | 目標二 |\n| 自來水廠參訪 | 校外場域 | 目標二、三 |\n| iPad、iMovie | 數位工具 | 目標三（表現任務） |\n其中自製的 Scratch 程式讓學生【請簡述：輸入哪些用水項目與次數，程式如何計算】，學生能立即看到自己一天的用水量，並與他國比較。（建議附程式畫面與學習單截圖）\n", "impl_c5": "本課程由本校跨領域共備社群共同發展與實施，社群成員來自【請填：領域，例如自然、社會、英語、科技】。（提醒：審查資料不可出現教師姓名，可用「自然領域教師」稱呼）\n| 日期 | 形式 | 討論重點 | 調整結果 |\n|---|---|---|---|\n| 【114/__/__】 | 共備 | 【例：過濾實驗的污水配方與評估標準】 | 【例：確定以透光度與過濾速度兩項指標評估】 |\n| 【114/__/__】 | 觀課 | 【例：過濾器探究課】 |  |\n| 【114/__/__】 | 議課 | 【】 | 【】 |\n【示範寫法】在一次共備中，自然領域教師提出【……】，社會領域教師則建議【……】，社群最後決定【……】，並在下一節課【……】。\n", "impl_c6": "實施過程中，我們依學生反應、課程時間與資源條件做了以下調整：\n| 節次／單元 | 原本的設計 | 調整情形 | 調整理由 |\n|---|---|---|---|\n| 第2節 一日用水量估算 | 自製 Scratch 程式 | 【保留／調整為：共用 Google 試算表】 | 【例：便於彙整全班數據比較】 |\n| 第4節 過濾器評估方式 | 學生討論評估方式 | 【保留／調整為：由教師指定透光度與速度】 | 【例：聚焦在設計與改良】 |\n| 第6節 自來水廠 | 結合校外教學參訪 | 【保留／調整為：】 | 【】 |\n| 第7–10節 表現任務 | 影片 5–6 分鐘 | 【保留／調整為：】 | 【】 |\n（以上「例」只是依計畫書裡已預留的彈性做的猜測，請換成實際的調整）\n【示範寫法】例如【某一節】原本【……】，實施時發現學生【……】，因此改為【……】，調整後【學生的表現或回饋】。\n", "eff_form": "本課程的形成性評量分布在每一節的檢核點，並對應三個課程目標。學習單占學期成績 30%，課程參與與合作占 20%。\n| 檢核點 | 評量方式 | 對應目標 | 評量發現與調整 |\n|---|---|---|---|\n| 水表與水費單任務 | 學生回報、分享 | 目標一 | 【】 |\n| 洗手用水量預測與實測 | 數據比較 | 目標一 | 【例：多數學生低估用水量】 |\n| 水與生活國際篇學習單 | 學習單 | 目標一 | 【】 |\n| 過濾觀察記錄與設計學習單 | 學習單 | 目標二 | 【】 |\n| 過濾器口頭報告 | 口頭報告 | 目標二 | 【例：部分組別只描述結果、沒說原因，因此提供說明句型】 |\n【示範寫法】從【某檢核點】發現【多少比例的學生】【……】，因此在下一節【……】，之後【……】。\n", "eff_sum": "### 表現任務說明\n學生分組製作 5–6 分鐘的影片，內容二選一：\n1. 我的省水妙招：設計日常節水妙招，實際執行並拍成宣導影片。\n2. 從水看世界：選擇善用水資源或極度缺水的國家，蒐集資料後拍攝介紹影片或現場報告。\n任務歷時四節：第七節介紹任務、分組，並與學生共同討論制定評量規準，同時學習 iMovie；第八、九節提案與製作；第十節發表並回饋。期末表現任務占學期成績 50%。\n### 評量規準（與學生共同制定）\n| 向度 | 表現優異 | 表現良好 | 待加強 |\n|---|---|---|---|\n| 內容正確性 | 【】 | 【】 | 【】 |\n| 資料蒐集與統整 | 【】 | 【】 | 【】 |\n| 方案可行性與實踐 | 【】 | 【】 | 【】 |\n| 影片表達與分工 | 【】 | 【】 | 【】 |\n【請換成實際與學生訂出的規準】\n讓學生參與訂定規準，學生在製作前就清楚「好的作品長什麼樣子」，並能依規準自我檢核，為自己的學習負責。【可補：學生討論規準時的發言或照片】\n", "eff_works": "本課程挑選【__】件學生作品，包括【__】支表現任務影片與【__】份過濾器設計學習單，分別呈現總結性與形成性評量的效果。挑選依據為評量規準的等級，選出表現優異、中等與待加強各一件，說明各件達成哪些課程目標、還缺少什麼，以及教師給予的回饋與後續輔導。影片以截圖搭配 QR code 呈現。\n", "ref_high": "### 課程設計\n從學生自己的一次洗手出發，連結到世界各國的取水現況，再回到在地的自來水，最後以行動收尾。這樣由近而遠、再回到自己的架構，讓水資源議題不再遙遠。\n### 課程實施\n在每週僅 0.5 節的時數下，仍讓學生完整經歷過濾器的「設計、測試、改良」探究歷程，並以透光度與速度等可測量的指標比較成效；Dollar Street 等真實影像資料，讓學生直接看見不同國家與收入家庭的用水差異。\n### 課程效果\n【請用數據或學生回饋佐證，例如：洗手用水量預測與實測的差距、過濾器改良前後的透光度、課程回饋問卷中學生最大的收穫】\n", "ref_adv": "### 學習難點與對應策略\n| 學習難點 | 觀察到的現象 | 對應策略 |\n|---|---|---|\n| 【例：濾材順序的推理】 | 【例：部分組別隨意堆疊濾材】 | 【例：先讓各組測試單一濾材，再設計組合】 |\n| 【例：影片內容流於資料羅列】 | 【】 | 【例：提供「現況—原因—與臺灣比較—我們能做什麼」的腳本鷹架】 |\n| 【例：節水方案停在宣導】 | 【】 | 【例：加入一週用水紀錄，比較執行前後的差異】 |\n### 設計層面\n設計理念提到結合本校國際交流機會，與他國學生交流水資源議題。【若已實施，改寫為亮點；若尚未實施，可寫下一輪的具體做法，例如與交流學校學生交換用水調查或節水影片】\n### 實施層面\n【可能的方向：每週 0.5 節、單雙週對開，兩次上課相隔較久，可寫你們如何讓學習延續，例如課初回顧、學習單跨節延續】\n### 效果層面\n學習表現第 5 點期望學生把節水方案實際運用在生活上，【請寫目前如何追蹤成效，以及下一輪的做法】。\n"};

const DEFAULTS = {"info.course": "水世界", "info.grade": ["八年級"], "info.sem": ["上學期"], "info.type": "統整性主題／專題／議題探究", "info.periods": 0.5, "info.total": 10, "design_text.text": "### 設計理念\n「水資源」是臺灣與世界各國都必須面對的重大議題，本課程希望帶領學生深入認識水資源的重要性與稀缺性，認識與探究不同的水資源取得與淨化方式，提升學生對水資源議題全面與深入的認識，並能結合本校國際交流機會，與他國學生交流討論水資源議題，提升學生成為地球公民的素養。\n### 課程目標\n1. 認識地球水資源的稀缺性與重要性，從自我用水情況到世界各國水資源運用現況，理解水資源現況與問題的全貌。\n2. 認識臺灣及世界各國的淨水科技，並探究自製淨水器的原理與提升效能的策略。\n3. 提出適當策略，改善自我用水效能，與降低生活造成的水污染，實踐地球公民共同節省用水及減少水污染的行動。\n### 核心素養\n- J-A2 具備理解情境全貌，並做獨立思考與分析的知能，運用適當策略處理解決生活議題。\n- J-A3 具備善用資源以擬定計畫，有效執行，並發揮主動學習與創新求變的素養。\n- J-B2 具備善用科技、資訊與媒體以增進學習的素養，並察覺、思辨人與科技、資訊、媒體的互動關係。\n- J-C1 培養道德思辨與實踐能力，具備環境意識，並主動關懷生態環境。\n- J-C2 具備利他與合群的知能與態度，並培育相互合作及與人和諧互動的素養。\n### 學習重點\n**學習表現**\n1. 學生能認識水資源的重要性、稀缺性。\n2. 學生能知道自己一天大約的用水量，以及此用水量與其他國家相比的差異。\n3. 學生能認識臺灣不同地區的水資源以及淨水方式。\n4. 學生實作探究不同過濾水方式的成效與差異，並提出可能的原因。\n5. 學生能提出自己的節水方案，並且實際運用在生活上。\n6. 學生能蒐集水資源充足及缺乏的國家現況，彙整資料後有條理地呈現。\n**學習內容**\n1. 世界水資源的認識。\n2. 現象觀察與問題發現。\n3. 水資源匱乏對地球環境的影響。\n4. 淨水、過濾水的原理與方式。\n### 議題融入\n- 環境教育 環J4：了解永續發展的意義（環境、社會、與經濟的均衡發展）與原則。\n- 國際教育 國J12：探索全球議題，並構思永續發展的在地行動方案。\n- 戶外教育 戶J2：擴充對環境的理解，運用所學的知識到生活當中，具備觀察、描述、測量、紀錄的能力。\n- 戶外教育 戶J4：理解永續發展的意義與責任，並在參與活動的過程中落實原則。", "impl_overview.text": "本課程為八年級上學期的一學期課程，每週 0.5 節（「水世界」與「臺灣之光」單雙週對開；與「碳生活」上下學期對開），全學期共 10 節。\n### 學習進度\n| 節次（週次） | 單元／子題 | 主要學習活動 |\n|---|---|---|\n| 第1節（1–2週） | 世界上的水：認識世界用水現況與聯合國目標 6 | 認識世界上的淡水總量與不同地區的水資源分布；介紹 Gapminder 網站，全班共讀聯合國目標 6（clean water & sanitation）的英文資料並回答問題；用便條紙寫下每天需要用水的時刻，選出最重要的 5 個，列出用水需求的優先順序 |\n| 第2節（3–4週） | 水有多重要？世界上的大家每天用了多少水？ | 認識一公升的水量；預測並實測手沾油污後洗淨所需的用水量，比較預測與實測的差距及不同洗手方式的差異；以自製 Scratch 程式（或共用 Google 試算表）估算一日用水量 |\n| 第3節（5–6週） | 世界各國使用水資源的現況 | 學習使用 Dollar Street，觀察不同國家、不同收入家庭的取水方式；提約 6 公升的水移動 100 公尺，並依一日用水量計算取水次數，體驗取水的困難；以 Dollar Street 比較各國洗手、使用清潔劑等情形，擇 3 類與臺灣比較異同 |\n| 第4節（7–8週） | 過濾水的探究課程（一） | 以 Dollar Street 中的水樣提問「這樣的水你敢喝嗎？」；分析生命吸管與露營用過濾器的濾材、功能與排列順序；以不同濾材過濾污水並記錄；分組設計粗吸管過濾器，討論評估方式 |\n| 第5節（9–10週） | 過濾水的探究課程（二） | 組裝粗吸管過濾器並實際過濾污水，檢視透光度與過濾速度；依結果提出改善方式，再過濾一次比較差異 |\n| 第6節（11–12週） | 乾淨水從哪裡來：認識水資源運用與淨水、節水方式 | 認識臺灣不同地區的用水方式、臺灣為何是缺水國家、萬華區的用水來源、本校的用水與節水方式；認識自來水廠的淨水運作並提出問題；結合校外教學參訪自來水廠 |\n| 第7節（13–14週） | 我的省水妙招／從水看世界（一） | 表現任務介紹、分組與任務選擇確認、評量規準討論與制定、iMovie 教學及實作、各組方案提案及影片規劃 |\n| 第8–9節（15–18週） | 我的省水妙招／從水看世界（二）、（三） | 方案內容提案與製作、發表練習 |\n| 第10節（19–20週） | 成果發表與課程總結 | 方案影片報告與發表、課程總結及回饋 |", "impl_c1.text": "第一節請學生用便條紙寫下每天哪些時刻需要用到水，選出對自己最重要的 5 個，並思考若要捨棄，會捨棄哪些、留下哪些，列出自己對水需求的優先順序。課後請學生回家找出家中的水表，觀察它的樣子與刻度單位，並檢視家中的水費單，看看每個月的用水量大約是自己一次洗手量的多少倍。\n第二節先盛裝一公升的水，讓學生認識一公升的水量，再請學生預測：手上沾了油污，要洗乾淨需要用多少水？接著讓學生將手沾油、用清潔劑洗淨，以 3000 mL 量筒承接並測量一次洗手的用水量，比較預測與實測的差距，並分享不同洗手方式的用水量差異。", "impl_c3.text": "### 觀察與分析\n以 Dollar Street 中部分國家的水樣為例，提問「這樣的水你敢喝嗎？」。學生認識生命吸管與其他露營用過濾器，分析商品設計用到哪些濾材、各有什麼功能、排列順序有什麼共同點。\n### 實作與設計\n教師準備設計好的污水（細碎枝葉、培養土與色素混合），學生以粗細砂石、活性碳、棉花等不同濾材過濾，觀察並記錄濾水後的效果。接著分組討論：若要以特定順序把濾材填充在粗吸管中，應該怎麼設計？要如何評估過濾器的效果？過濾水的乾淨程度以透光度檢測，並同時檢測過濾速度。\n### 測試與改良\n各組依設計組裝粗吸管過濾器，實際過濾教師準備的污水，檢視透光度與過濾速度；再根據結果提出改善方式，重新過濾一次並比較差異，最後以口頭報告說明過濾器原本的設計方式、成效、改進方式與改良後的差異。", "impl_c4.text": "本課程使用的教學資源如下：\n| 資源 | 類型 | 使用節次 |\n|---|---|---|\n| Gapminder 網站（聯合國目標 6 相關英文資料與問題） | 網路資源 | 第1節 |\n| 自製 Scratch 一日用水量估算程式（或共用 Google 試算表） | 自編教材 | 第2節 |\n| Dollar Street（get water、hand washing、drinking water 等主題） | 網路資源 | 第3–4節 |\n| 剛果取水影片 | 影片 | 第3節 |\n| 學習單「水與生活國際篇」 | 自編學習單 | 第3節 |\n| 學習單「過濾觀察記錄與過濾器設計」 | 自編學習單 | 第4節 |\n| 3000 mL 量筒 | 實作器材 | 第2節 |\n| 粗細砂石、活性碳、棉花、粗吸管 | 實作器材 | 第4–5節 |\n| 自來水廠參訪 | 校外場域 | 第6節 |\n| iPad、iMovie | 數位工具 | 第7–10節 |\n教學設施包括網際網路、筆電、電腦教室、學生 Google 帳號、iPad 與智慧黑板。", "eff_form.text": "本課程在各節安排檢核點作為形成性評量；評量規劃中，學習單占 30%，課程參與與合作占 20%。\n| 節次 | 檢核點（形成性評量） |\n|---|---|\n| 第1節 | 回家找出家中的水表，觀察外觀與刻度單位；檢視水費單，估算家中每月用水量約為自己一次洗手量的多少倍 |\n| 第2節 | 回顧上週的水費單與水表任務 |\n| 第3節 | 學習單「水與生活國際篇」：擇 3 個類別比較不同國家與臺灣的異同 |\n| 第4節 | 學習單「過濾觀察記錄與過濾器設計」 |\n| 第5節 | 口頭報告：說明過濾器原本的設計方式、成效、改進方式與改良後的差異 |", "eff_sum.text": "### 表現任務說明\n學生分組製作影片，內容二選一，影片時間 5–6 分鐘：\n1. 設計日常節水妙招，實作並拍出宣導影片。\n2. 針對善用水資源或極度缺水的國家，蒐集資料，拍攝介紹影片或現場報告。\n### 任務進行方式\n- 第7節：表現任務介紹、分組與任務選擇確認、評量規準討論與制定、iMovie 教學及實作、各組方案提案及影片規劃。\n- 第8–9節：方案內容提案與製作、發表練習。\n- 第10節：方案影片報告與發表、課程總結及回饋。\n期末表現任務占學期成績 50%。"       .then(r => r.text())

        let j; try { j = JSON.parse(t); } catch (e) { throw new Error('資料庫回應格式不對：請確認 Code.gs 已更新並「部署新版本」，存取權為「所有人」'); }
        if (j.error) throw new Error(j.error);
        return j.result;
      })
      .catch(e => { throw (e.name === 'AbortError' ? new Error('連線逾時') : (e.message === 'Failed to fetch' ? new Error('連不到資料庫（網路或網址有誤）') : e)); })
      .finally(() => clearTimeout(tm));
  }
  if (MODE === 'demo') return Mock[fn](...args);

  fields: {},          // key -> {v, ver, at, by}
  dirty: {},           // key -> true（尚未存）
  inflight: {},        // key -> true
  timers: {},
  conflicts: [],
  since: 0,
  pane: LS.getItem('lh_pane') || 'dash',
  pw: LS.getItem('lh_pw') || '',
  name: LS.getItem('lh_name') || '',
  edit: false,
  saveErr: '',
  pageInfo: null,      // {total, secs:{id:{start,end}}}
  kaiOK: null
};
const get = (k, d) => (S.fields[k] && S.fields[k].v !== undefined && S.fields[k].v !== null) ? S.fields[k].v : (k in DEFAULTS ? DEFAULTS[k] : d);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmtTime = ms => { if (!ms) return ''; const d = new Date(Number(ms)); const p = n => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
function parseVal(v) { if (v === '' || v == null) return v; try { return JSON.parse(String(v)); } catch (e) { return v; } }

/* =========================================================
 *  儲存（逐欄、防抖、版本檢查）
 * ========================================================= */
function setVal(key, val, { delay = 1200, rerender = false } = {}) {
  if (!S.edit) return;
  const f = S.fields[key] || (S.fields[key] = { v: undefined, ver: 0, at: 0, by: '' });
  f.v = val;
  S.dirty[key] = true;
  clearTimeout(S.timers[key]);
  S.timers[key] = setTimeout(() => flush(key), delay);
  updateSaveUI();
  if (rerender) refreshKey(key);
  schedulePreview();
}
async function flush(key, force = false) {
  if (!S.dirty[key] || S.inflight[key]) return;
  if (S.conflicts.some(c => c.key === key)) return;   // 等使用者處理衝突
  S.inflight[key] = true;
  const f = S.fields[key];
  const sentVal = f.v;
  updateSaveUI();
  try {
    const r = await gs('api_save', S.pw, key, JSON.stringify(sentVal), f.ver || 0, S.name, force);
    if (r.conflict) {
      S.inflight[key] = false;
      queueConflict(key, r.current);
      return;
    }
    f.ver = r.ver; f.at = r.at; f.by = r.by;
    if (f.v === sentVal) delete S.dirty[key];
    S.saveErr = '';
  } catch (e) {
    S.saveErr = (e && e.message) || String(e);
    if (/密碼/.test(S.saveErr)) { exitEdit(); toast('編輯密碼錯誤，請重新進入編輯模式'); }
  }
  S.inflight[key] = false;
  updateSaveUI();
  refreshMeta(key);
  if (S.dirty[key]) setTimeout(() => flush(key), 300);
}
function flushAll() { Object.keys(S.dirty).forEach(k => { clearTimeout(S.timers[k]); flush(k); }); }
function updateSaveUI() {
  const el = $('#hdSave');
  const n = Object.keys(S.dirty).length;
  el.className = 'pill';
  if (S.saveErr) { el.classList.add('err'); el.textContent = '儲存失敗：' + S.saveErr.slice(0, 40); }
  else if (n) { el.classList.add('saving'); el.textContent = `儲存中…（${n}）`; }
  else { el.classList.add('ok'); el.textContent = S.edit ? `✓ 已儲存・${S.name || '編輯中'}` : '檢視模式（唯讀）'; }
}
window.addEventListener('beforeunload', e => { if (Object.keys(S.dirty).length) { flushAll(); e.preventDefault(); e.returnValue = ''; } });

/* ---------- 衝突處理 ---------- */
function queueConflict(key, cur) {
  if (S.conflicts.some(c => c.key === key)) return;
  S.conflicts.push({ key, cur: { v: parseVal(cur.v), ver: Number(cur.ver), at: cur.at, by: cur.by } });
  if (S.conflicts.length === 1) showConflict();
}
function keyLabel(key) {
  const [id, part] = key.split('.');
  const it = ALL_ITEMS.find(i => i.id === id);
  if (it) return it.title + ({ text:'（文字）', imgs:'（圖片）', sub:'（副標）' }[part] || '');
  const m = /^work(\d)$/.exec(id); if (m) return `學生作品${cn(+m[1])}` + ({ text:'（說明）', imgs:'（圖片）', title:'（名稱）', level:'（層級）', on:'（是否放入）', done:'（完成標記）' }[part] || '');
  const NM = { 'info.course':'課程名稱', 'info.school':'學校', 'info.planLink':'課程計畫連結', 'basic.members':'團隊成員', 'video.link':'教學影片連結' };
  if (NM[key]) return NM[key];
  return key;
}
function showConflict() {
  const c = S.conflicts[0]; if (!c) return;
  const mine = S.fields[c.key].v;
  const isText = typeof mine === 'string' && typeof c.cur.v === 'string';
  const isArr = Array.isArray(mine) && Array.isArray(c.cur.v);
  const prevTheirs = typeof c.cur.v === 'string' ? c.cur.v : JSON.stringify(c.cur.v, null, 1);
  openModal(`<h3>兩人同時修改了同一欄</h3>
    <p>「${esc(keyLabel(c.key))}」在你編輯時，<b>${esc(c.cur.by || '另一位夥伴')}</b> 於 ${fmtTime(c.cur.at)} 也存了新版本。</p>
    <div class="muted" style="font-size:13px">對方的版本：</div><pre>${esc(String(prevTheirs).slice(0, 1500))}</pre>
    <div class="acts">
      <button class="btn" data-c="theirs">改用對方的版本</button>
      ${(isText || isArr) ? '<button class="btn" data-c="merge">合併兩個版本</button>' : ''}
      <button class="btn pri" data-c="mine">保留我的（覆蓋）</button>
    </div>`, false);
  $$('#modalBox [data-c]').forEach(b => b.onclick = () => resolveConflict(b.dataset.c));
}
function resolveConflict(choice) {
  const c = S.conflicts.shift(); closeModal();
  const f = S.fields[c.key];
  if (choice === 'theirs') {
    f.v = c.cur.v; f.ver = c.cur.ver; f.at = c.cur.at; f.by = c.cur.by; delete S.dirty[c.key];
  } else {
    if (choice === 'merge') {
      if (Array.isArray(f.v)) {
        const ids = new Set(f.v.map(x => x && x.id));
        f.v = f.v.concat(c.cur.v.filter(x => !ids.has(x && x.id)));
      } else {
        f.v = f.v + '\n\n（以下為 ' + (c.cur.by || '夥伴') + ' 的版本）\n' + c.cur.v;
      }
    }
    f.ver = c.cur.ver; S.dirty[c.key] = true; flush(c.key);
  }
  refreshKey(c.key, true); updateSaveUI(); schedulePreview();
  if (S.conflicts.length) showConflict();
}

/* ---------- 輪詢更新 ---------- */
async function poll() {
  if (document.hidden) return;
  try {
    const r = await gs('api_changes', S.since);
    S.since = r.now - 5000;
    let changed = false;
    Object.entries(r.fields).forEach(([k, rf]) => {
      const lf = S.fields[k];
      const ver = Number(rf.ver) || 0;
      if (lf && lf.ver >= ver) return;
      if (S.dirty[k] || S.inflight[k]) return;  // 存檔時會處理衝突
      S.fields[k] = { v: parseVal(rf.v), ver, at: Number(rf.at), by: rf.by };
      refreshKey(k, true); changed = true;
    });
    if (changed) { schedulePreview(); renderNav(); if (S.pane === 'dash') renderPane(); }
  } catch (e) { /* 網路不穩時略過 */ }
}
setInterval(poll, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

/* =========================================================
 *  檔案與圖片
 * ========================================================= */
const blobCache = {};
/* 瀏覽器端的檔案快取（IndexedDB）：檔案上傳後內容不會變，存一次就能一直用 */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('lh_files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('f');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      setTimeout(() => rej(new Error('timeout')), 2000);
    } catch (e) { rej(e); }
  }));
  return {
    async get(k) {
      try { const db = await open(); return await new Promise(res => { const q = db.transaction('f').objectStore('f').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }
      catch (e) { return undefined; }
    },
    async set(k, v) { try { const db = await open(); db.transaction('f', 'readwrite').objectStore('f').put(v, k); } catch (e) {} }
  };
})();
function b64ToBlob(b64, mime) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: mime });
}
/* 把同一時間要的檔案集中成幾批，一次向伺服器要 */
const pendFiles = new Map(); let pendTimer = null;
function fetchFileBatched(id) {
  return new Promise((res, rej) => {
    pendFiles.set(id, { res, rej });
    clearTimeout(pendTimer); pendTimer = setTimeout(flushFileBatch, 30);
  });
}
function flushFileBatch() {
  const all = [...pendFiles.entries()]; pendFiles.clear();
  for (let i = 0; i < all.length; i += 6) {
    const part = all.slice(i, i + 6);
    gs('api_getFiles', part.map(([id]) => id))
      .then(map => part.forEach(([id, p]) => map && map[id] ? p.res(map[id]) : p.rej(new Error('找不到檔案'))))
      .catch(e => part.forEach(([, p]) => p.rej(e)));
  }
}
function getBlob(id) {
  if (!blobCache[id]) {
    blobCache[id] = (async () => {
      const c = await IDB.get(id);
      if (c && c.blob) return { blob: c.blob, url: URL.createObjectURL(c.blob), name: c.name };
      const r = await fetchFileBatched(id);
      const blob = b64ToBlob(r.b64, r.mime);
      IDB.set(id, { blob, name: r.name });
      return { blob, url: URL.createObjectURL(blob), name: r.name };
    })().catch(e => { delete blobCache[id]; throw e; });
  }
  return blobCache[id];
}
function readAsDataURL(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); }); }
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('無法讀取圖片')); im.src = src; }); }
async function resizeImage(file, maxSide, q) {
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);
    const s = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.round(im.naturalWidth * s), h = Math.round(im.naturalHeight * s);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(im, 0, 0, w, h);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    return { blob, w, h };
  } finally { URL.revokeObjectURL(url); }
}
async function uploadBlob(blob, name, kind) {
  const d = await readAsDataURL(blob);
  return gs('api_upload', S.pw, { name, mime: blob.type || 'application/octet-stream', b64: d.split(',')[1], kind, by: S.name });
}
async function uploadImages(key, fileList) {
  const files = [...fileList].filter(f => /^image\//.test(f.type));
  if (!files.length) { toast('請選擇圖片檔（jpg、png…）'); return; }
  let done = 0;
  for (const f of files) {
    toast(`上傳圖片 ${++done}/${files.length}…`, 60000);
    try {
      const full = await resizeImage(f, 1600, 0.85);
      const th = await resizeImage(f, 400, 0.72);
      const a = await uploadBlob(full.blob, f.name.replace(/\.\w+$/, '') + '.jpg', 'img');
      const b = await uploadBlob(th.blob, f.name.replace(/\.\w+$/, '') + '_thumb.jpg', 'thumb');
      blobCache[a.id] = Promise.resolve({ blob: full.blob, url: URL.createObjectURL(full.blob) });
      blobCache[b.id] = Promise.resolve({ blob: th.blob, url: URL.createObjectURL(th.blob) });
      IDB.set(a.id, { blob: full.blob, name: a.name }); IDB.set(b.id, { blob: th.blob, name: b.name });
      const arr = (get(key, []) || []).slice();
      arr.push({ id: a.id, tid: b.id, w: full.w, h: full.h, cap: f.name.replace(/\.\w+$/, '').replace(/^(IMG|DSC|PXL)[_-]?\d+.*/i, '') });
      setVal(key, arr, { delay: 200, rerender: true });
    } catch (e) { toast('上傳失敗：' + (e.message || e), 4000); return; }
  }
  toast('上傳完成');
}
async function uploadAttachments(key, fileList) {
  const files = [...fileList];
  for (const f of files) {
    if (f.size > 30 * 1024 * 1024) { toast(`${f.name} 超過 30MB，請改放雲端硬碟後貼連結`, 4000); continue; }
    toast(`上傳 ${f.name}…`, 60000);
    try {
      const r = await uploadBlob(f, f.name, 'attach');
      const arr = (get(key, []) || []).slice();
      arr.push({ id: r.id, name: f.name, size: f.size, mime: f.type, by: S.name, at: Date.now() });
      setVal(key, arr, { delay: 200, rerender: true });
    } catch (e) { toast('上傳失敗：' + (e.message || e), 4000); return; }
  }
  toast('上傳完成');
}
async function downloadAttachment(id, name) {
  toast('準備下載…', 30000);
  try { const r = await getBlob(id); triggerDownload(r.blob, name || r.name); toast('已開始下載'); }
  catch (e) { toast('下載失敗：' + (e.message || e), 4000); }
}
function triggerDownload(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.target = '_self';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

/* =========================================================
 *  簡易標記語法 → 區塊
 *  ### 小標｜- 項目｜1. 編號｜| 表格 |｜**粗體**
 * ========================================================= */
function parseRich(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  const out = []; let i = 0;
  while (i < lines.length) {
    const raw = lines[i]; const line = raw.trim();
    if (!line) { i++; continue; }
    if (/^\|/.test(line)) {
      const rows = []; let header = false;
      while (i < lines.length && /^\|/.test(lines[i].trim())) {
        const l = lines[i].trim();
        if (/^\|?\s*:?-{2,}/.test(l.replace(/\|/g, '|')) && /^[\s|:\-]+$/.test(l)) { if (rows.length === 1) header = true; }
        else rows.push(l.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim()));
        i++;
      }
      const n = Math.max(...rows.map(r => r.length));
      rows.forEach(r => { while (r.length < n) r.push(''); });
      out.push({ t:'table', header, rows: rows.map(r => r.map(inline)) });
      continue;
    }
    let m;
    if ((m = /^#{2,4}\s*(.+)$/.exec(line))) out.push({ t:'h4', runs: inline(m[1]) });
    else if ((m = /^[-•・*]\s+(.+)$/.exec(line))) out.push({ t:'li', marker:'•', runs: inline(m[1]) });
    else if ((m = /^(\d{1,2}[.、)）]|[（(][一二三四五六七八九十\d]{1,3}[)）]|[一二三四五六七八九十]{1,2}、)\s*(.+)$/.exec(line))) out.push({ t:'li', marker: m[1], runs: inline(m[2]) });
    else out.push({ t:'p', runs: inline(line) });
    i++;
  }
  return out;
}
function inline(s) {
  const runs = [];
  String(s).split(/(\*\*[^*]+\*\*)/).forEach(seg => {
    if (!seg) return;
    const b = /^\*\*[^*]+\*\*$/.test(seg);
    const text = b ? seg.slice(2, -2) : seg;
    text.split(/(https?:\/\/[^\s，。、）)」]+)/).forEach(p => {
      if (!p) return;
      if (/^https?:\/\//.test(p)) runs.push({ text: p, b, link: p });
      else runs.push({ text: p, b });
    });
  });
  return runs;
}
const plain = runs => runs.map(r => r.text).join('');

function schoolShort() {

/* ---------- 圖片排版尺寸（cm） ---------- */
const TEXT_W_CM = 21 - 3.17 * 2;   // 14.66
function imgSize(img, cols) {
  const maxH = Number(get('set.imgMaxH', 8)) || 8;
  const gap = 0.4;
  const colW = (TEXT_W_CM - gap * (cols - 1)) / cols;
  const r = (img.h || 3) / (img.w || 4);
  let w = colW * (cols === 1 ? 0.8 : 1), h = w * r;
  if (h > maxH) { h = maxH; w = h / r; }
  return { w: +w.toFixed(2), h: +h.toFixed(2) };
}
/* 依各欄文字量決定欄寬比例（避免長文字欄被擠窄） */
function colWeights(rows) {
  const n = rows[0].length;
  const len = c => plain(c).length;
  const w = Array.from({ length: n }, (_, i) => {
    const ls = rows.map(r => len(r[i] || []));
    const avg = ls.reduce((a, b) => a + b, 0) / ls.length;
    return Math.pow(Math.max(4, Math.min(avg, 80), Math.max(...ls) * 0.35), 0.75);
  });
  const sum = w.reduce((a, b) => a + b, 0);
  let pct = w.map(x => x / sum);
  pct = pct.map(x => Math.max(x, 0.12));
  const s2 = pct.reduce((a, b) => a + b, 0);
  return pct.map(x => x / s2);
}

}

  blocks.forEach(b => {

        b.lines.filter(Boolean).forEach(l => kids.push(P({ alignment: D.AlignmentType.CENTER, spacing:{ line:360 }, children:[new D.TextRun({ text:l, bold:true, font:FONT, size:SZH })] })));
        kids.push(P({ children: [] }), P({ children: [] }));
        kids.push(P({ alignment: D.AlignmentType.CENTER, spacing:{ line:360 }, children:[new D.TextRun({ text:'課程名稱：' + b.course, bold:true, font:FONT, size:SZH })] }));
        kids.push(P({ alignment: D.AlignmentType.CENTER, spacing:{ line:360 }, children:[new D.TextRun({ text:b.school, bold:true, font:FONT, size:SZH })] }));
        kids.push(P({ children:[new D.PageBreak()] }));

      case 'title2': kids.push(P({ alignment: D.AlignmentType.CENTER, spacing:{ line:240, after:200 }, children:[new D.TextRun({ text:b.text, bold:true, font:FONT, size:SZH })] })); break;
      case 'h1': kids.push(P({ keepNext:true, pageBreakBefore: !!b.brk, spacing:{ line:240, before:240, after:120 }, children:[new D.TextRun({ text:b.text, bold:true, font:FONT, size:SZH })] })); break;
      case 'h2': kids.push(P({ keepNext:true, spacing:{ line:240, before:180, after:60 }, children:[new D.TextRun({ text:b.text, bold:true, font:FONT, size:SZ })] })); break;
      case 'h3': kids.push(P({ keepNext:true, spacing:{ line:240, before:120, after:60 }, children:[new D.TextRun({ text:b.text, bold:true, font:FONT, size:SZ })] })); break;

            new D.TableCell({ width:{ size:TW - w1, type:D.WidthType.DXA }, children:[cellP(inline(v))] })

function privacyHits() {
  const names = String(get('basic.members', '')).split(/[、,，;；\s\/]+/).map(s => s.trim()).filter(s => s.length >= 2);
  const blocks = buildDoc();
  const txt = blocks.map(b => b.text || (b.runs ? plain(b.runs) : '') || (b.rows ? b.rows.flat().map(c => Array.isArray(c) ? plain(c) : c).join(' ') : '') || (b.imgs ? b.imgs.map(x => x.cap).join(' ') : '')).join('\n');
  const hits = names.filter(n => txt.includes(n)).map(n => `姓名「${n}」`);
  if (/09\d{2}[-\s]?\d{3}[-\s]?\d{3}/.test(txt)) hits.push('手機號碼');
  if (/[\w.+-]+@[\w-]+\.[\w.]+/.test(txt)) hits.push('電子郵件');
  if (/[A-Z][12]\d{8}/.test(txt)) hits.push('疑似身分證字號');
  return hits;
}
function itemStatus(id) {

}

  $('#nav').innerHTML = NAV.map(n => {
    if (n.sep) return '<div class="sep"></div>';
    const sec = SECS.find(s => s.id === n.id);
    const dot = sec ? `<span class="dot ${secStatus(sec)}"></span>` : '';
    return `<button class="ni ${S.pane === n.id ? 'on' : ''}" data-pane="${n.id}">${dot}${esc(n.label)}${n.w ? `<span class="w">${esc(n.w)}</span>` : ''}</button>`;
  }).join('');
  $$('#nav [data-pane]').forEach(b => b.onclick = () => go(b.dataset.pane));
}
function go(p) { flushAll(); S.pane = p; LS.setItem('lh_pane', p); renderNav(); renderPane(); window.scrollTo(0, 0); }
function renderHeader() {
  const c = get('info.course', '');
  $('#hdCourse').textContent = c ? `${schoolShort()}｜${c}` : '審查資料整理';
  $('#btnMode').textContent = S.edit ? '結束編輯' : '進入編輯';

}
function renderCount() {
  const now = new Date();
  let t;
  if (now < OPEN_AT) t = `距收件開始 ${Math.ceil((OPEN_AT - now) / 864e5)} 天・截止 12/31 17:00`;
  else if (now < DEADLINE) { const h = (DEADLINE - now) / 36e5; t = h > 48 ? `距截止還有 ${Math.ceil(h / 24)} 天` : `距截止還有 ${Math.floor(h)} 小時`; }
  else t = '收件已截止';
  if (S.pageInfo) t += `・預覽 ${S.pageInfo.total} 頁`;
  $('#hdCount').textContent = t;
}

const RO = () => S.edit ? '' : 'readonly';
const DIS = () => S.edit ? '' : 'disabled';
function fText(key, label, ph = '', type = 'text', extra = '') {
  return `<label class="fld"><span>${esc(label)}</span><input type="${type}" data-key="${key}" value="${esc(get(key, ''))}" placeholder="${esc(ph)}" ${RO()} ${extra}></label>`;
}
function fChecks(key, opts) {
  const v = get(key, []) || [];
  return opts.map(o => `<label class="chk"><input type="checkbox" data-arr="${key}" value="${esc(o)}" ${v.includes(o) ? 'checked' : ''} ${DIS()}>${esc(o)}</label>`).join('');

function fBool(key, label, def = false) {
  return `<label class="chk"><input type="checkbox" data-bool="${key}" ${get(key, def) ? 'checked' : ''} ${DIS()}>${esc(label)}</label>`;
}
function metaLine(id) {
  if (!(S.fields[id + '.text'] && S.fields[id + '.text'].at) && DEFAULTS[id + '.text']) return '<span style="color:var(--accent)">📋 這段已從課程計畫帶入，尚未編輯；可直接修改或補充實施情形</span>';
  const ks = [id + '.text', id + '.imgs', id + '.sub', id + '.title'].map(k => S.fields[k]).filter(f => f && f.at);
  if (!ks.length) return '';
  const f = ks.sort((a, b) => b.at - a.at)[0];
  return `最後修改：${esc(f.by || '—')}・${fmtTime(f.at)}`;
}

function workDraftHTML(id) {
  return `<details class="ex dr"><summary>作品說明示範文字</summary>
    <div class="exnote">依表現層級分三種寫法；【】請換成這件作品的實際內容。</div>
    ${Object.entries(WORK_DRAFTS).map(([lv, t]) => `<div class="exc"><div class="exh"><b>${esc(lv)}</b>${S.edit ? `<button class="btn sm" style="margin-left:auto" data-wdraft="${id}" data-lv="${esc(lv)}">插入</button>` : ''}</div><div>${esc(t).replace(/(【[^】]*】)/g, '<mark>$1</mark>')}</div></div>`).join('')}
  </details>`;
}
function fillDraft(id, text) {
  const t = textareaOf(id); if (!t) return;
  if (t.value.trim()) {
    if (!confirm('文字框已有內容，要把示範文字加在最後面嗎？')) return;
    t.value = t.value.replace(/\s*$/, '') + '\n\n' + text;
  } else t.value = text;
  commitTA(t); autoGrow(t);
}
function renderPane() {
  const m = $('#main');
  const sec = SECS.find(s => s.id === S.pane);
  m.innerHTML = S.pane === 'dash' ? paneDash() : S.pane === 'basic' ? paneBasic() : S.pane === 'preview' ? panePreview() : S.pane === 'plan' ? panePlan() : sec ? paneSec(sec) : paneDash();
  bindPane(m);
  loadThumbs(m);
  $$('textarea', m).forEach(autoGrow);
  if (S.pane === 'preview') refreshPreview();
}

/* ---------- 事件綁定 ---------- */
function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.max(140, t.scrollHeight + 4) + 'px'; }
function bindPane(m) {
  $$('[data-key]', m).forEach(el => {
    const key = el.dataset.key;
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      let v = el.value;
      if (el.dataset.num) v = Number(v);
      setVal(key, v, { delay: el.tagName === 'SELECT' ? 100 : 1200 });
      if (el.tagName === 'TEXTAREA') { autoGrow(el); const c = $(`[data-cnt="${el.dataset.rich}"]`); if (c) c.textContent = el.value.replace(/\s/g, '').length + ' 字'; }
      if (key === 'info.course' || key === 'info.schoolShort' || key === 'info.school') renderHeader();
      if (/\.(text|imgs)$/.test(key)) renderNav();
    });
    el.addEventListener('blur', () => { if (S.dirty[key]) { clearTimeout(S.timers[key]); flush(key); } });
  });
  $$('[data-arr]', m).forEach(el => el.addEventListener('change', () => {
    const key = el.dataset.arr;
    const v = $$(`[data-arr="${key}"]`, m).filter(x => x.checked).map(x => x.value);
    setVal(key, v, { delay: 100 });
  }));
  $$('[data-bool]', m).forEach(el => el.addEventListener('change', () => {
    setVal(el.dataset.bool, el.checked, { delay: 100 });
    if (/^work\d\.on$/.test(el.dataset.bool)) renderPane();
  }));
  $$('[data-done]', m).forEach(el => el.addEventListener('click', () => {
    if (!S.edit) return toast('請先進入編輯模式');
    const id = el.dataset.done; const v = !get(id + '.done', false);
    setVal(id + '.done', v, { delay: 100 });
    el.classList.toggle('on', v); el.textContent = v ? '✓ 已完成' : '標記完成'; renderNav();
  }));
  $$('[data-up]', m).forEach(el => el.addEventListener('change', () => { uploadImages(el.dataset.up, el.files); el.value = ''; }));
  $$('[data-att]', m).forEach(el => el.addEventListener('change', () => { uploadAttachments(el.dataset.att, el.files); el.value = ''; }));
  $$('[data-drop]', m).forEach(el => {
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); uploadImages(el.dataset.drop, e.dataTransfer.files); });
  });
  $$('[data-cap]', m).forEach(el => el.addEventListener('input', () => {
    const key = el.dataset.cap; const arr = (get(key, []) || []).map(x => Object.assign({}, x));
    if (arr[+el.dataset.i]) { arr[+el.dataset.i].cap = el.value; setVal(key, arr); }
  }));
  $$('[data-mv]', m).forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.mv, i = +el.dataset.i, j = i + Number(el.dataset.d);
    const arr = (get(key, []) || []).slice(); if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]]; setVal(key, arr, { delay: 300, rerender: true });
  }));
  $$('[data-del]', m).forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.del, i = +el.dataset.i;
    const arr = (get(key, []) || []).slice(); const x = arr[i];
    if (!x || !confirm('確定移除這張圖片？')) return;
    arr.splice(i, 1); setVal(key, arr, { delay: 100, rerender: true });
    gs('api_deleteFile', S.pw, x.id, S.name).catch(() => {}); if (x.tid) gs('api_deleteFile', S.pw, x.tid, S.name).catch(() => {});
  }));
  $$('[data-adel]', m).forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.adel, i = +el.dataset.i;
    const arr = (get(key, []) || []).slice(); const x = arr[i];
    if (!x || !confirm(`確定移除「${x.name}」？`)) return;
    arr.splice(i, 1); setVal(key, arr, { delay: 100, rerender: true });
    gs('api_deleteFile', S.pw, x.id, S.name).catch(() => {});
  }));
  $$('[data-dl]', m).forEach(el => el.addEventListener('click', () => downloadAttachment(el.dataset.dl, el.dataset.nm)));
  $$('[data-md]', m).forEach(el => el.addEventListener('click', () => mdAction(el.dataset.id, el.dataset.md)));
  $$('[data-draft]', m).forEach(el => el.addEventListener('click', () => fillDraft(el.dataset.draft, DRAFTS[el.dataset.draft])));
  $$('[data-wdraft]', m).forEach(el => el.addEventListener('click', () => fillDraft(el.dataset.wdraft, WORK_DRAFTS[el.dataset.lv])));
  $$('[data-skel]', m).forEach(el => el.addEventListener('click', () => {
    const t = textareaOf(el.dataset.skel); if (!t) return;
    if (t.value.trim() && !confirm('文字框已有內容，要把段落架構插入在游標位置嗎？')) return;
    if (!t.value.trim()) { t.selectionStart = t.selectionEnd = 0; }
    insertAtCursor(el.dataset.skel, SKELETON[el.dataset.skel]);
  }));
  $$('[data-tbl]', m).forEach(el => el.addEventListener('change', () => { if (el.value) insertAtCursor(el.dataset.tbl, '\n' + TABLE_TPL[el.value]); el.value = ''; }));
  $$('[data-pane-link]', m).forEach(el => el.addEventListener('click', e => { e.preventDefault(); go(el.dataset.paneLink); }));
}
function textareaOf(id) { return $(`textarea[data-rich="${id}"]`); }
function commitTA(t) { t.dispatchEvent(new Event('input')); t.focus(); }
function insertAtCursor(id, txt) {
  const t = textareaOf(id); if (!t) return;
  const s = t.selectionStart, e = t.selectionEnd;
  t.value = t.value.slice(0, s) + txt + t.value.slice(e);
  t.selectionStart = t.selectionEnd = s + txt.length; commitTA(t);
}
function mdAction(id, kind) {
  const t = textareaOf(id); if (!t) return;
  const s = t.selectionStart, e = t.selectionEnd, v = t.value;
  if (kind === 'bold') {
    const sel = v.slice(s, e) || '粗體文字';
    t.value = v.slice(0, s) + '**' + sel + '**' + v.slice(e);
    t.selectionStart = s + 2; t.selectionEnd = s + 2 + sel.length;
  } else {
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    const pre = kind === 'h' ? '### ' : '- ';
    t.value = v.slice(0, ls) + pre + v.slice(ls);
    t.selectionStart = t.selectionEnd = e + pre.length;
  }
  commitTA(t);
}
function loadThumbs(root) {
  $$('[data-thumb]', root).forEach(el => {
    getBlob(el.dataset.thumb).then(r => { el.style.backgroundImage = `url("${r.url}")`; el.textContent = ''; }).catch(() => { el.textContent = '無法載入'; });
  });
}
/* 遠端更新或本地結構變動時，只重畫受影響的部分 */
function refreshKey(key, remote = false) {
  const m = $('#main');
  const comp = $(`[data-comp="${key}"]`, m);
  if (comp) {
    const id = key.replace(/\.(imgs|attach)$/, '');
    const tmp = document.createElement('div');
    tmp.innerHTML = /\.imgs$/.test(key) ? galleryHTML(id) : attachHTML(key, comp.querySelector('b') ? comp.querySelector('b').textContent : '');
    const nw = tmp.firstElementChild; comp.replaceWith(nw); bindPane(nw); loadThumbs(nw);
  }
  $$(`[data-key="${key}"]`, m).forEach(el => {
    if (document.activeElement === el && !remote) return;
    if (document.activeElement === el && remote) { toast(`${keyLabel(key)} 已被夥伴更新`); }
    el.value = get(key, el.dataset.num ? '' : '');
    if (el.tagName === 'TEXTAREA') autoGrow(el);
  });
  $$(`[data-bool="${key}"]`, m).forEach(el => { el.checked = !!get(key, false); });
  $$(`[data-arr="${key}"]`, m).forEach(el => { el.checked = (get(key, []) || []).includes(el.value); });
  $$(`[data-done="${key.replace(/\.done$/, '')}"]`, m).forEach(el => { if (!/\.done$/.test(key)) return; const v = get(key, false); el.classList.toggle('on', v); el.textContent = v ? '✓ 已完成' : '標記完成'; });
  if (/^work\d\.on$/.test(key) && remote) renderPane();
  refreshMeta(key);
  if (/^info\./.test(key)) renderHeader();
}
function refreshMeta(key) { const id = key.split('.')[0]; const el = $(`[data-meta="${id}"]`); if (el) el.innerHTML = metaLine(id); }

/* ---------- 編輯模式 ---------- */
function openModal(html, closable = true) {
  $('#modalBox').innerHTML = html; $('#modal').classList.add('on');
  $$('#modalBox [data-close]').forEach(b => b.onclick = closeModal);
  $('#modal').onclick = e => { if (closable && e.target.id === 'modal') closeModal(); };
}
function closeModal() { $('#modal').classList.remove('on'); }
function askEdit() {
  openModal(`<h3>進入編輯模式</h3>
    <p class="muted" style="margin-top:0">只看網址的人可以瀏覽與輸出文件；要修改內容需要編輯密碼。</p>
    <label class="fld"><span>你的名字（會顯示在「最後修改」）</span><input type="text" id="mName" value="${esc(S.name)}" placeholder="例：志鵬"></label>
    <label class="fld" style="margin-top:10px"><span>編輯密碼</span><input type="password" id="mPw" value=""></label>
    <div id="mErr" class="conf" style="display:none"></div>
    <div class="acts"><button class="btn" data-close>取消</button><button class="btn pri" id="mGo">進入編輯</button></div>`);
  setTimeout(() => $('#mName').value ? $('#mPw').focus() : $('#mName').focus(), 50);
  const go = async () => {
    const name = $('#mName').value.trim(), pw = $('#mPw').value;
    if (!name) { $('#mErr').style.display = 'block'; $('#mErr').textContent = '請輸入名字'; return; }
    $('#mGo').disabled = true;
    const ok = await gs('api_checkPassword', pw).catch(() => false);
    $('#mGo').disabled = false;
    if (!ok) { $('#mErr').style.display = 'block'; $('#mErr').textContent = '密碼不正確'; return; }
    S.pw = pw; S.name = name; S.edit = true;
    LS.setItem('lh_pw', pw); LS.setItem('lh_name', name);
    closeModal(); renderAll(); toast('已進入編輯模式，內容會自動儲存');
  };
  $('#mGo').onclick = go; $('#mPw').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function exitEdit() { flushAll(); S.edit = false; LS.removeItem('lh_pw'); renderAll(); }
$('#btnMode').onclick = () => S.edit ? exitEdit() : askEdit();
$('#btnSplit').onclick = () => {
  document.body.classList.toggle('split');
  LS.setItem('lh_split', document.body.classList.contains('split') ? '1' : '');
  if (document.body.classList.contains('split')) refreshPreview();
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  ({ refreshPreview, printPdf, exportDocx, saveDocxToDrive })[b.dataset.act]();
});
function renderAll() { renderHeader(); renderNav(); renderPane(); updateSaveUI(); }

/* ---------- 字型偵測 ---------- */
function hasFont(f) {
  const c = document.createElement('canvas').getContext('2d'); const s = '臺北市彈性學習領航課程永';
  return ['monospace', 'serif', 'sans-serif'].some(base => { c.font = `40px ${base}`; const a = c.measureText(s).width; c.font = `40px "${f}", ${base}`; return c.measureText(s).width !== a; });
}

/* ---------- 啟動 ---------- */
(async function init() {
  if (MODE === 'demo') $('#demoBar').style.display = 'block';
  $('#btnSetApi').onclick = () => {
    const u = (prompt('貼上 Apps Script 網頁應用程式網址（結尾是 /exec）：', '') || '').trim();
    if (!u) return;
    if (!API_RE.test(u)) { alert('網址格式不對，應該像 https://script.google.com/macros/s/……/exec'); return; }
    LS.setItem('lh_api', u); location.href = location.pathname + '?api=' + encodeURIComponent(u);
  };
  if (LS.getItem('lh_split') && innerWidth > 900) document.body.classList.add('split');
  S.kaiOK = ['標楷體', 'DFKai-SB', 'BiauKai', 'BiauKaiTC', 'Kaiti TC', 'TW-Kai', 'AR PL UKai TW'].some(hasFont);
  try {
    let boot = null;
    try { const t = (document.getElementById('boot').textContent || '').trim(); if (t.charAt(0) === '{') boot = JSON.parse(t); } catch (e) {}
    const r = boot || await gs('api_getAll');
    Object.entries(r.fields).forEach(([k, f]) => { S.fields[k] = { v: parseVal(f.v), ver: Number(f.ver) || 0, at: Number(f.at) || 0, by: f.by }; });
    S.since = r.now - 5000;
  } catch (e) {
    $('#main').innerHTML = `<div class="loading">讀取資料失敗：${esc(e.message || e)}<br>請確認已執行 setup()、Code.gs 已部署新版本，並重新整理頁面。${MODE === 'api' ? `<br><br><button class="btn" onclick="LS.removeItem('lh_api');location.href=location.pathname">改用示範模式／重新設定資料庫網址</button>` : ''}</div>`;
    return;
  }
  // 記得密碼的話先直接進入編輯模式，密碼在背景驗證，不用等
  if (S.pw && S.name) {
    S.edit = true;
    gs('api_checkPassword', S.pw).then(ok => {
      if (!ok) { S.edit = false; S.pw = ''; LS.removeItem('lh_pw'); renderAll(); toast('編輯密碼已變更，請重新進入編輯'); }
    }).catch(() => {});
  }
  renderAll();
  if (document.body.classList.contains('split')) refreshPreview();
  setInterval(renderCount, 60000);
})();
</script>
